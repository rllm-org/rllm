name: Test Tinker engine

on:
  push:
    branches: [main, terminal-rl]
    paths:
      - "rllm/engine/rollout/**"
      - "rllm/engine/agentflow_engine.py"
      - "rllm/engine/remote_agent_flow_engine.py"
      - "rllm/engine/trace_converter.py"
      - "rllm/gateway/manager.py"
      - "rllm/trainer/tinker/**"
      - "rllm/trainer/verl/transform.py"
      - "rllm/trainer/buffer.py"
      - "rllm/trainer/algorithms/visualization.py"
      - "rllm/types.py"
      - "rllm/utils/episode_logger.py"
      - "rllm-model-gateway/src/rllm_model_gateway/client.py"
      - "tests/engine/test_tinker_engine.py"
      - "tests/engine/test_agentflow_engine.py"
      - "tests/trainer/test_datum_dataproto_delta.py"
      - ".github/workflows/test-tinker.yml"
  pull_request:
    branches: [main, terminal-rl, step-deepcopy-skip]
    paths:
      - "rllm/engine/rollout/**"
      - "rllm/engine/agentflow_engine.py"
      - "rllm/engine/remote_agent_flow_engine.py"
      - "rllm/engine/trace_converter.py"
      - "rllm/gateway/manager.py"
      - "rllm/trainer/tinker/**"
      - "rllm/trainer/verl/transform.py"
      - "rllm/trainer/buffer.py"
      - "rllm/trainer/algorithms/visualization.py"
      - "rllm/types.py"
      - "rllm/utils/episode_logger.py"
      - "rllm-model-gateway/src/rllm_model_gateway/client.py"
      - "tests/engine/test_tinker_engine.py"
      - "tests/engine/test_agentflow_engine.py"
      - "tests/trainer/test_datum_dataproto_delta.py"
      - ".github/workflows/test-tinker.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra tinker --extra dev

      - name: Run Tinker engine tests
        run: uv run pytest tests/engine/test_tinker_engine.py -v

      - name: Run compact consumer parity tests
        run: uv run pytest tests/trainer/test_datum_dataproto_delta.py tests/engine/test_agentflow_engine.py -v
